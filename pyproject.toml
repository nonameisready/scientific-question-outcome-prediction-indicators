[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-question-outcome-prediction-indicators"
version = "1.0.0"
description = "A temporally grounded dataset of scientific questions with future-outcome labels, and predictor-discovery analyses of what makes a question succeed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/nonameisready/scientific-question-outcome-prediction-indicators"
"Benchmark (Paper 2)" = "https://github.com/nonameisready/scientific-question-discovery-benchmark"
"Question Generation (Paper 1)" = "https://github.com/nonameisready/scientific-question-discovery"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
